[package]
name = "cert-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Show TLS certificate details for one or more hosts"
license = "MIT"
repository = "https://github.com/ytkhs/cert-rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.39"
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
x509-parser = "0.18.1"

[dev-dependencies]
assert_cmd = "2.2.2"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }

[[bin]]
name = "cert"
path = "src/main.rs"
